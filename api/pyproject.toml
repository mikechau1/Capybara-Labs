[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "capybara-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Pin exact versions. Add new dependencies in the PR for the card that needs them.
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.0.56",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.7",  # PostgreSQL driver; the binary extra needs no system libraries
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx2==2.16.2",  # used by FastAPI's TestClient
  "ruff==0.17.5",
  "markdown-it-py==4.3.0",  # renders answers in tests/test_answering.py (card M3-04)
]

# Installs dependencies only; the code runs from this folder.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
