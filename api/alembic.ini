# Alembic (database migrations). Card M1-04 owns this file.
# The database URL is not set here: migrations/env.py reads DATABASE_URL from the environment.
# How to add a migration: migrations/README.md

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Files are named <revision>_<message>, e.g. 0002_departments_and_sources.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
