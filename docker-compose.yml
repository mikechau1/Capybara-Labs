# Local stack. Start with:   docker compose up --build
# Add Keycloak (SSO) with:   docker compose --profile sso up --build
# Card M1-02 owns this file.

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capybara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capybara}
      POSTGRES_DB: ${POSTGRES_DB:-capybara}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Only started with --profile sso, so nobody needs Keycloak until cards M1-05..M1-07.
  idp:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["sso"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  ui:
    build: ./ui
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  dbdata:
