# Local stack. Start with:   docker compose up --build
# Add Keycloak (SSO) with:   docker compose --profile sso up --build
# Card M1-02 owns this file.

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capybara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capybara}
      POSTGRES_DB: ${POSTGRES_DB:-capybara}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # Port on your machine; set POSTGRES_HOST_PORT in .env if 5432 is already taken.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Only started with --profile sso, so nobody needs Keycloak until cards M1-05..M1-07.
  idp:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["sso"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Serves /health/ready on the management port 9000 (inside the container only).
      KC_HEALTH_ENABLED: "true"
      # Tokens name their issuer after the address Keycloak was reached on. Fix it to the
      # browser's address, so a token from a login at localhost:8080 still matches
      # OIDC_ISSUER when the api checks it; containers keep reaching Keycloak at idp:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no curl, so bash opens the connection itself and checks for HTTP 200.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ $$status == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      # Waits for Keycloak only when it runs (--profile sso); otherwise this is skipped.
      idp:
        condition: service_healthy
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no curl; Python fails (exit 1) on any error or non-2xx response.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build: ./ui
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Streamlit's built-in health endpoint.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8501:8501"

volumes:
  dbdata:
