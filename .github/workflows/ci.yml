# Card M1-08 owns this file. Lint and test every pull request.
# The job names (lint, test-api, test-ui) are the required checks in branch protection on
# main and skeleton. Renaming a job means updating those settings too, or merges get stuck.
# TODO(M2-08): make the leakage suite a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main, skeleton]

# A new push to a pull request cancels the run still going for its previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg16 # same image as docker-compose.yml
        env:
          POSTGRES_USER: capybara
          POSTGRES_PASSWORD: capybara
          POSTGRES_DB: capybara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capybara -d capybara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Fail instead of skipping if the database tests cannot reach Postgres.
      REQUIRE_TEST_DB: "1"
      DATABASE_URL: postgresql+psycopg://capybara:capybara@localhost:5432/capybara
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install ".[dev]"
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      - name: Models and migrations match (fails if a model changed without a migration)
        run: alembic check
      - run: pytest -q

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ui/pyproject.toml
      - run: pip install ".[dev]"
      - run: pytest -q
