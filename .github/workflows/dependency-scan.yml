# Card M1-09 owns this file. A daily check for vulnerabilities published since code merged.
#
# CI (ci.yml) scans Python packages on every pull request. A new advisory, though, can land
# on a pin that is already merged, and then every open pull request goes red at once. This
# run finds it first, so someone can bump the pin before teammates are blocked. It also scans
# the Docker images, which CI does not.
#
# GitHub runs schedules, and the Run workflow button, only from the default branch (main), so
# this starts once skeleton is merged into main. From then on it also scans skeleton every day,
# and Actions → Dependency scan → Run workflow starts it by hand. A failed scheduled run emails
# whoever last changed the cron line below.
name: Dependency scan

on:
  schedule:
    - cron: "0 14 * * *" # every day, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The branches people build on. Remove skeleton once it has been merged into main.
        branch: [main, skeleton]
        service: [api, ui]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same steps as the Dependency scan in ci.yml; keep the pip-audit version in step.
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: pip install pip-audit==2.10.1 && pip-audit

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        branch: [main, skeleton]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      # Builds api and ui, then scans every image the stack uses, read from docker-compose.yml
      # so a bumped image tag is scanned without editing this file. Only HIGH and CRITICAL
      # vulnerabilities that already have a fixed version fail the run; anything else is noise
      # nobody can act on. To fix one, bump the image tag in docker-compose.yml or the Dockerfile.
      #
      # gosu is skipped. The Postgres image uses it once, at startup, to drop root, and its
      # findings are all in Go's network and TLS code, which gosu never runs. Every Postgres
      # image ships it, so no bump would clear them, and the run would stay red for good.
      #
      # Findings waiting on an upstream fix are listed, with an expiry date, in
      # .github/trivyignore.yaml.
      - run: docker compose --profile sso build --pull
      - name: Scan images
        run: |
          status=0
          for image in $(docker compose --profile sso config --images); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.github/trivyignore.yaml:/trivyignore.yaml:ro" \
              aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --skip-files usr/local/bin/gosu --ignorefile /trivyignore.yaml \
              --exit-code 1 --no-progress "$image" || status=1
            echo "::endgroup::"
          done
          exit $status
